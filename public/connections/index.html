<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Connect MERLIN to the home services it can really control, and read honest setup guides for the rest.">
  <title>Connection center · MERLIN</title>
  <link rel="icon" href="data:,">
  <!-- Relative on purpose: MERLIN serves this page at /connections/ and `npm run connections` serves it at /. -->
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to connections</a>
  <header class="topbar">
    <a class="brand" href="#" aria-label="MERLIN connection center home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 13v5m12-5v5M13 22h6M16 2v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>MERLIN</span><span class="brand-divider"></span><span class="brand-section">Connections</span></a>
    <nav class="view-nav" aria-label="Connection views">
      <button id="browse-view" class="nav-button" aria-current="page">Browse</button>
      <button id="connected-view" class="nav-button" hidden>Connected <span id="connected-count" class="nav-count">0</span></button>
    </nav>
  </header>
  <div id="mode-banner" class="mode-banner"><span id="mode-label" class="mode-label"></span><p id="mode-text"></p></div>
  <main id="main" tabindex="-1">
    <div id="load-notice" class="load-notice" role="alert" hidden></div>
    <section id="directory" aria-labelledby="page-title">
      <div class="page-heading">
        <div><h1 id="page-title">Connection center</h1><p id="page-subtitle"></p><p id="search-status" class="search-status" hidden></p></div>
      </div>
      <div class="search-row">
        <div class="search-field"><label class="visually-hidden" for="search">Search companies, devices, or categories</label><span id="search-icon" class="field-icon"></span><input id="search" type="search" placeholder="Search companies, devices, or categories" autocomplete="off" spellcheck="false"><button id="clear-search" class="icon-button" aria-label="Clear search" hidden></button></div>
        <div class="filter-field"><label for="company">Company</label><select id="company"><option value="all">All companies</option></select></div>
        <div class="filter-field"><label for="difficulty">Setup difficulty</label><select id="difficulty"><option value="all">Any difficulty</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
      </div>
      <div class="directory-layout">
        <aside class="categories" aria-label="Filter by category"><h2>Categories</h2><div id="category-list"></div><p class="sidebar-note">Ratings describe the setup for someone who already owns the device. A route label says how MERLIN can reach it.</p></aside>
        <div class="mobile-category filter-field"><label for="category-mobile">Category</label><select id="category-mobile"><option value="all">All categories</option></select></div>
        <section class="results" aria-labelledby="results-heading">
          <div class="results-heading"><h2 id="results-heading">All connections <span id="results-count"></span></h2><button id="reset-filters" class="text-button" hidden>Reset filters</button></div>
          <p id="results-announcement" class="visually-hidden" role="status" aria-live="polite"></p>
          <div class="list-head" aria-hidden="true"><span>Company &amp; connection</span><span>Setup</span><span></span></div>
          <div id="connection-list"></div>
          <div id="empty-state" class="empty-state" hidden><span id="empty-icon" class="empty-icon"></span><h3 id="empty-title"></h3><p id="empty-description"></p><button id="empty-action" class="secondary"></button></div>
        </section>
      </div>
    </section>
    <section id="setup" class="setup" aria-labelledby="setup-title" hidden></section>
    <noscript><p class="load-notice">Enable JavaScript to search the directory and connect services.</p></noscript>
  </main>
  <footer class="page-footer"><span>MERLIN · A helpful home, one connection at a time.</span><span id="footer-note"></span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
